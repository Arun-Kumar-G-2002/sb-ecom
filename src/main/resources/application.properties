spring.application.name=sb-ecom

# Set root logging level to INFO (production default)
logging.level.root=INFO
logging.level.org.springframework.beans=INFO
logging.level.org.springframework.context=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cache=INFO

# JPA and Hibernate Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#to use internal caching technique
spring.cache.type=simple

# Server Configuration
server.port = 8082

project.image=images/

# CORS Configuration
spring.web.cors.allow-credentials=true
spring.web.cors.allowed-origin-patterns=*

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sb-ecom
spring.datasource.username=arun
spring.datasource.password=root123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update


#spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.initialization-mode=always
#spring.datasource.initialization-mode=EMBEDDED
#spring.sql.init.mode=always
spring.sql.init.mode=EMBEDDED
spring.sql.init.platform=postgres